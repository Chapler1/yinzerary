<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Browse All - Yinzerary</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<nav>
  <span class="brand">Yinzerary</span>
  <a href="index.html" class="tab active">Browse All</a>
  <a href="calendar.html" class="tab">Calendar</a>
  <a href="farmers-markets.html" class="tab">Farmers Markets</a>
</nav>
<main>
<div class="content-narrow">
<h1>Browse All Events</h1>
<p class="subtitle">Every upcoming event we've ingested. Recurring farmers markets have their own <a href="farmers-markets.html">dedicated page</a>.</p>
<p class="stamp" id="stamp"></p>

<form class="filters" id="filters" onsubmit="return false">
  <div><label for="f-q">Search</label><input type="text" id="f-q" placeholder="keyword..."></div>
  <div><label for="f-tag">Tag</label><select id="f-tag"><option value="">All</option></select></div>
  <div><label for="f-source">Source</label><select id="f-source"><option value="">All</option></select></div>
  <div><label for="f-from">From</label><input type="date" id="f-from"></div>
  <div><label for="f-to">To</label><input type="date" id="f-to"></div>
  <div id="f-clear-wrap" hidden><button type="button" class="btn secondary" id="f-clear">Clear</button></div>
</form>

<div class="legend">
  <span>&#127882; Festival / fair</span>
  <span>&#127925; Live music</span>
  <span>&#127912; Art</span>
  <span>&#127908; Comedy</span>
  <span>&#128205; Other</span>
</div>

<p class="subtitle" id="count">Loading&hellip;</p>
<div class="card-grid" id="grid"></div>
</div>
</main>

<script src="assets/common.js"></script>
<script>
const grid = document.getElementById('grid');
const countEl = document.getElementById('count');
const el = id => document.getElementById(id);
let EVENTS = [];

function fillSelect(select, values) {
  values.forEach(v => {
    const o = document.createElement('option');
    o.value = o.textContent = v;
    select.appendChild(o);
  });
}

function currentFilters() {
  return {
    q: el('f-q').value.trim().toLowerCase(),
    tag: el('f-tag').value,
    source: el('f-source').value,
    from: el('f-from').value,
    to: el('f-to').value,
  };
}

function render() {
  const f = currentFilters();
  const events = EVENTS.filter(e => {
    const day = e.start_dt.slice(0, 10);
    if (f.tag && !e.tags.includes(f.tag)) return false;
    if (f.source && !e.sources.some(s => s.source === f.source)) return false;
    if (f.from && day < f.from) return false;
    if (f.to && day > f.to) return false;
    if (f.q && !(e.title + ' ' + (e.description || '')).toLowerCase().includes(f.q)) return false;
    return true;
  });

  let html = '', lastDay = null;
  events.forEach(e => {
    const day = e.start_dt.slice(0, 10);
    if (day !== lastDay) { html += dayHeading(day); lastDay = day; }
    html += eventCard(e);
  });
  grid.innerHTML = events.length ? html : '<div class="empty" style="grid-column:1/-1">No events match these filters.</div>';
  countEl.textContent = events.length + (events.length === 1 ? ' event' : ' events');
  el('f-clear-wrap').hidden = !(f.q || f.tag || f.source || f.from || f.to);
}

['f-q', 'f-tag', 'f-source', 'f-from', 'f-to'].forEach(id => {
  el(id).addEventListener('input', render);
  el(id).addEventListener('change', render);
});
el('f-clear').addEventListener('click', () => {
  ['f-q', 'f-tag', 'f-source', 'f-from', 'f-to'].forEach(id => { el(id).value = ''; });
  render();
});

loadJson('data/events.json').then(data => {
  EVENTS = data.events;
  el('stamp').textContent = stampText(data.generated_at);
  fillSelect(el('f-tag'), [...new Set(EVENTS.flatMap(e => e.tags))].sort());
  fillSelect(el('f-source'), [...new Set(EVENTS.flatMap(e => e.sources.map(s => s.source)))].sort());
  render();
}).catch(err => { countEl.textContent = ''; showLoadError(grid, err); });
</script>
</body>
</html>
